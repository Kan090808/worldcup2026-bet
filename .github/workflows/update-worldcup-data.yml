name: Update World Cup data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-worldcup-data.yml'
      - 'scripts/fetch-worldcup.js'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-worldcup-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch World Cup data
        run: node scripts/fetch-worldcup.js

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update worldcup data'
          file_pattern: data/worldcup2026.json
