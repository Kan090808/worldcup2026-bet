<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 世界盃虛擬下注</title>
  <style>
    :root{--bg:#070a12;--card:#111827;--card2:#172033;--line:#263247;--text:#e5e7eb;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090d16,#05070b);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px 14px 90px}header{position:sticky;top:0;z-index:10;background:rgba(8,11,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.top{max-width:1120px;margin:auto;padding:12px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center}.brand{font-weight:900;color:var(--gold)}.sub{font-size:12px;color:var(--muted);margin-top:2px}.wallet{display:flex;align-items:center;gap:8px}.money{background:var(--card);border:1px solid #8a6d16;border-radius:12px;padding:8px 12px;text-align:right}.money small{display:block;color:var(--muted);font-size:11px}.money b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold);font-size:18px}.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--gold);color:#111;border:none;font-weight:800}.btn:disabled{opacity:.45;cursor:not-allowed}.status{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;background:var(--card);font-size:14px;line-height:1.5}.status.ok{border-color:rgba(34,197,94,.35);color:#bbf7d0}.status.err{border-color:rgba(239,68,68,.45);color:#fecaca}.status.warn{border-color:rgba(245,158,11,.45);color:#fde68a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold);font-size:18px}.stat span{font-size:11px;color:var(--muted)}.tabs,.market-tabs{display:flex;gap:6px;margin:16px 0}.tab,.market-tab{border:none;border-radius:10px;padding:9px 16px;background:var(--card);color:var(--muted);cursor:pointer;font-weight:700}.tab.active,.market-tab.active{background:var(--gold);color:#111}.section-title{font-size:20px;font-weight:900;margin:22px 0 10px}.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card.bettable{cursor:pointer}.card.bettable:hover{border-color:#a78b00;transform:translateY(-1px)}.head{display:flex;justify-content:space-between;background:var(--card2);padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.teams{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 8px}.team{text-align:center;flex:1}.flag{font-size:28px;display:block}.name{font-size:13px;font-weight:800;margin-top:4px}.vs{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);padding:0 8px}.score{font-size:22px;color:var(--gold);font-weight:900}.venue{text-align:center;color:var(--muted);font-size:11px;padding:0 8px 10px}.odds{display:flex;gap:6px;padding:0 12px 12px}.odd{flex:1;background:#0b1220;border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 4px}.odd span{display:block;font-size:10px;color:var(--muted)}.odd b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold)}.chip{font-size:11px;border-radius:999px;padding:3px 8px}.chip.open{color:#bbf7d0;background:rgba(34,197,94,.12)}.chip.done{color:#cbd5e1;background:rgba(148,163,184,.12)}.chip.lock{color:#fecaca;background:rgba(239,68,68,.12)}.history{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.history th,.history td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:13px}.history th{color:var(--muted);font-size:11px;background:var(--card2)}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:end;justify-content:center;z-index:50}.modal.open{display:flex}.panel{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:12px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.options.score-grid{grid-template-columns:repeat(4,1fr)}.pick{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px 8px;cursor:pointer;text-align:center;color:var(--text)}.pick.selected{border-color:var(--gold);background:#241d05}.pick b{display:block;color:var(--gold);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:4px}.stake{display:flex;gap:8px;margin-top:12px}.stake input{flex:1;background:#05070b;border:1px solid var(--line);border-radius:10px;color:var(--gold);font-size:18px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}.hide{display:none}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.options,.options.score-grid{grid-template-columns:1fr}.top{align-items:flex-start}.wallet{flex-direction:column;align-items:flex-end}.matches{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="top"><div><div class="brand">⚽ 2026 世界盃虛擬下注</div><div class="sub">GitHub Pages 靜態頁 · Actions 更新 JSON · 模型賠率：Elo + Poisson + margin</div></div><div class="wallet"><div class="money"><small>虛擬餘額</small><b id="balance">NT$10,000</b></div></div></div></header>
<main class="wrap">
  <div id="dataStatus" class="status warn">讀取 data/worldcup2026.json 中…</div>
  <div class="grid"><div class="stat"><b id="sBalance">NT$10,000</b><span>目前餘額</span></div><div class="stat"><b id="sBets">0</b><span>下注筆數</span></div><div class="stat"><b id="sPending">0</b><span>待結算</span></div><div class="stat"><b id="sProfit">+NT$0</b><span>已結算盈虧</span></div></div>
  <div class="tabs"><button id="tabUnfinished" class="tab active" onclick="showTab('unfinished')">未完成</button><button id="tabFinished" class="tab" onclick="showTab('finished')">已完成</button><button id="tabChampion" class="tab" onclick="showTab('champion')">猜冠軍</button><button id="tabHistory" class="tab" onclick="showTab('history')">下注記錄</button></div>
  <section id="matchesView"><div id="matchesRoot" class="empty">尚未取得賽事資料</div></section>
  <section id="championView" class="hide"><div class="stake"><input id="championStake" type="number" min="10" value="100"><button id="cancelChampionEdit" class="btn hide" onclick="cancelChampionEdit()">取消修改</button></div><div id="championRoot" class="empty">尚未取得冠軍賠率</div></section>
  <section id="historyView" class="hide"><div id="historyRoot"></div></section>
</main>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeBet()"><div class="panel"><div class="panel-head"><div><h3 id="mTitle" style="margin:0 0 4px"></h3><div id="mMeta" class="sub"></div></div><button class="btn" onclick="closeBet()">關閉</button></div><div class="market-tabs"><button id="mt-h2h" class="market-tab active" onclick="switchMarket('h2h')">勝平負</button><button id="mt-spreads" class="market-tab" onclick="switchMarket('spreads')">讓球</button><button id="mt-correct_score" class="market-tab" onclick="switchMarket('correct_score')">正確比分</button></div><div id="mOptions" class="options"></div><div class="stake"><input id="stake" type="number" min="10" value="100" oninput="updatePayout()"><button id="placeBtn" class="btn primary" onclick="saveBet()" disabled>確認下注</button></div><div id="payout" class="note">請選擇投注選項</div><div id="marketNote" class="note"></div></div></div>
<script>
const DATA_URL='data/worldcup2026.json';
const STORE_BAL='wc_static_balance_v2';
const STORE_BETS='wc_static_bets_v2';
const TEAM={'France':['法國','🇫🇷'],'Brazil':['巴西','🇧🇷'],'Argentina':['阿根廷','🇦🇷'],'Spain':['西班牙','🇪🇸'],'England':['英格蘭','🏴'],'Germany':['德國','🇩🇪'],'Netherlands':['荷蘭','🇳🇱'],'Portugal':['葡萄牙','🇵🇹'],'Japan':['日本','🇯🇵'],'Australia':['澳洲','🇦🇺'],'Canada':['加拿大','🇨🇦'],'South Africa':['南非','🇿🇦'],'Morocco':['摩洛哥','🇲🇦'],'Paraguay':['巴拉圭','🇵🇾'],'Switzerland':['瑞士','🇨🇭'],'USA':['美國','🇺🇸'],'United States':['美國','🇺🇸'],'Mexico':['墨西哥','🇲🇽'],'Norway':['挪威','🇳🇴'],'Sweden':['瑞典','🇸🇪'],'Ivory Coast':['象牙海岸','🇨🇮'],'Egypt':['埃及','🇪🇬'],'Cape Verde':['佛得角','🇨🇻'],'Belgium':['比利時','🇧🇪'],'Croatia':['克羅埃西亞','🇭🇷'],'Ghana':['迦納','🇬🇭'],'Panama':['巴拿馬','🇵🇦'],'Colombia':['哥倫比亞','🇨🇴'],'DR Congo':['剛果民主共和國','🇨🇩'],'Uzbekistan':['烏茲別克','🇺🇿'],'Jordan':['約旦','🇯🇴'],'Algeria':['阿爾及利亞','🇩🇿'],'Austria':['奧地利','🇦🇹'],'South Korea':['韓國','🇰🇷'],'Czech Republic':['捷克','🇨🇿'],'Czechia':['捷克','🇨🇿'],'Bosnia & Herzegovina':['波士尼亞與赫塞哥維納','🇧🇦'],'Bosnia and Herzegovina':['波士尼亞與赫塞哥維納','🇧🇦'],'Qatar':['卡達','🇶🇦'],'Haiti':['海地','🇭🇹'],'Scotland':['蘇格蘭','🏴󠁧󠁢󠁳󠁣󠁴󠁿'],'Turkey':['土耳其','🇹🇷'],'Curaçao':['庫拉索','🇨🇼'],'Curacao':['庫拉索','🇨🇼'],'Ecuador':['厄瓜多','🇪🇨'],'Tunisia':['突尼西亞','🇹🇳'],'Iran':['伊朗','🇮🇷'],'New Zealand':['紐西蘭','🇳🇿'],'Saudi Arabia':['沙烏地阿拉伯','🇸🇦'],'Uruguay':['烏拉圭','🇺🇾'],'Senegal':['塞內加爾','🇸🇳'],'Iraq':['伊拉克','🇮🇶']};
const RLBL={'Round of 32':'32強','Round of 16':'16強','Quarter-final':'八強','Semi-final':'四強','Match for third place':'季軍賽','Final':'決賽'};
function sectionKey(m){return m.group||m.round}
function sectionLabel(k){const g=String(k).match(/^Group ([A-L])$/);return g?g[1]+' 組':(RLBL[k]||k)}
let dataOk=false,matches=[],currentMatch=null,selected=null,currentMarket='h2h',matchFilter='unfinished',editingBet=null,editingChampionBet=null,payloadMeta=null;
let balance=Number(localStorage.getItem(STORE_BAL)||10000);
let bets=JSON.parse(localStorage.getItem(STORE_BETS)||'[]');
function fmt(n){return 'NT$'+Math.round(Math.abs(n)).toLocaleString('zh-TW')}
function save(){localStorage.setItem(STORE_BAL,String(balance));localStorage.setItem(STORE_BETS,JSON.stringify(bets))}
function teamName(n){return (TEAM[n]&&TEAM[n][0])||n||'待定'}
function flag(n){return (TEAM[n]&&TEAM[n][1])||'🏳️'}
function isTbd(n){const v=String(n||'');return !v||/^TBD/i.test(v)||/^[WL]\d+/.test(v)||/^[1-3][A-L]$/.test(v)||v.includes('/')}
function state(m){if(m.score)return'finished';if(!m.kickoffUTC)return'unknown';const diff=(new Date(m.kickoffUTC).getTime()-Date.now())/60000;if(diff<5)return'locked';return'open'}
function hasAnyOdds(m){return !!(m.odds && ((m.odds.h2h||[]).length || (m.odds.spreads||[]).length || (m.odds.correct_score||[]).length))}
function canBet(m){return dataOk&&!m.score&&state(m)==='open'&&!isTbd(m.team1)&&!isTbd(m.team2)&&hasAnyOdds(m)}
async function loadData(){const st=document.getElementById('dataStatus');try{const res=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const json=await res.json();if(!Array.isArray(json.matches)||json.matches.length===0)throw new Error('JSON 無 matches');dataOk=true;payloadMeta=json;matches=json.matches;st.className='status ok';const oddsText=json.oddsSource==='model'?'模型賠率已啟用':'賠率資料未標示來源';st.textContent='✅ 賽事資料已載入：'+json.matchCount+' 場；'+oddsText+'；更新時間 '+new Date(json.fetchedAt).toLocaleString('zh-TW');settleBets();render()}catch(e){dataOk=false;matches=[];st.className='status err';st.innerHTML='❌ 無法讀取賽事資料，下注功能已停用。原因：'+e.message+'<br>請確認 GitHub Action 已產生 data/worldcup2026.json。';render()}}
function finalWinner(){const m=matches.find(x=>x.round==='Final'&&x.score);if(!m)return null;return Number(m.score.home)>Number(m.score.away)?m.team1:Number(m.score.home)<Number(m.score.away)?m.team2:null}
function settleBets(){let changed=false;const champion=finalWinner();for(const b of bets){if(b.status!=='pending')continue;if(b.market==='champion'){if(!champion)continue;const won=b.pick===champion;b.status=won?'win':'loss';b.settledAt=new Date().toISOString();if(won)balance+=b.payout;changed=true;continue}const m=matches.find(x=>x.id===b.matchId);if(!m||!m.score)continue;let won=false;const hs=Number(m.score.home),as=Number(m.score.away);if(b.market==='h2h'){const result=hs>as?'home':hs<as?'away':'draw';won=b.pick===result}else if(b.market==='spreads'){const adjusted=b.pick==='home'?hs + Number(b.point):as + Number(b.point);const other=b.pick==='home'?as:hs;won=adjusted>other}else if(b.market==='correct_score'){won=hs===Number(b.homeScore)&&as===Number(b.awayScore)}b.status=won?'win':'loss';b.settledAt=new Date().toISOString();b.finalScore=hs+'-'+as;if(won)balance+=b.payout;changed=true}if(changed)save()}
function render(){updateStats();renderMatches();renderChampion();renderHistory()}
function updateStats(){document.getElementById('balance').textContent=fmt(balance);document.getElementById('sBalance').textContent=fmt(balance);document.getElementById('sBets').textContent=bets.length;document.getElementById('sPending').textContent=bets.filter(b=>b.status==='pending').length;const profit=bets.reduce((s,b)=>b.status==='win'?s+b.payout-b.amount:b.status==='loss'?s-b.amount:s,0);const el=document.getElementById('sProfit');el.textContent=(profit>=0?'+':'-')+fmt(profit);el.style.color=profit>0?'var(--green)':profit<0?'var(--red)':'var(--muted)'}
function renderMatches(){const root=document.getElementById('matchesRoot');if(!dataOk){root.className='empty';root.textContent='沒有資料，賽事列表與下注功能停用。';return}const list=matches.filter(m=>matchFilter==='finished'?m.score:!m.score);if(!list.length){root.className='empty';root.textContent=matchFilter==='finished'?'沒有已完成賽事':'沒有未完成賽事';return}const rounds=[...new Set(list.map(sectionKey))];root.className='';root.innerHTML=rounds.map(r=>'<div class="section-title">'+sectionLabel(r)+'</div><div class="matches">'+list.filter(m=>sectionKey(m)===r).map(card).join('')+'</div>').join('')}
function card(m){const s=state(m),bet=canBet(m);const chip=m.score?'done':s==='open'&&hasAnyOdds(m)?'open':'lock';const chipText=m.score?'已完賽':s==='open'&&hasAnyOdds(m)?'可下注':'封盤/無賠率';const ko=m.kickoffUTC?new Date(m.kickoffUTC).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'時間待定';const h2h=(m.odds&&m.odds.h2h)||[];const oddsHtml=bet&&h2h.length?'<div class="odds">'+h2h.slice(0,3).map(o=>'<div class="odd"><span>'+o.label+'</span><b>'+Number(o.price).toFixed(2)+'</b></div>').join('')+'</div>':'';return '<div class="card '+(bet?'bettable':'')+'" '+(bet?'onclick="openBet(\''+m.id+'\')"':'')+'><div class="head"><span>'+sectionLabel(sectionKey(m))+' #'+(m.num||m.round||m.id)+'</span><span class="chip '+chip+'">'+chipText+'</span></div><div class="teams"><div class="team"><span class="flag">'+flag(m.team1)+'</span><div class="name">'+teamName(m.team1)+'</div></div><div class="vs">'+(m.score?'<span class="score">'+m.score.home+'-'+m.score.away+'</span>':'VS')+'</div><div class="team"><span class="flag">'+flag(m.team2)+'</span><div class="name">'+teamName(m.team2)+'</div></div></div><div class="venue">'+ko+' · '+(m.venue||'')+'</div>'+oddsHtml+'</div>'}
function renderChampion(){const root=document.getElementById('championRoot');const list=(payloadMeta&&payloadMeta.championOdds)||[];document.getElementById('cancelChampionEdit').classList.toggle('hide',!editingChampionBet);if(!dataOk||!list.length){root.className='empty';root.textContent='尚未取得冠軍賠率';return}root.className='';root.innerHTML='<table class="history"><thead><tr><th>球隊</th><th>冠軍機率</th><th>賠率</th><th>操作</th></tr></thead><tbody>'+list.map((o,i)=>'<tr><td><span class="flag">'+flag(o.team)+'</span> '+teamName(o.team)+'</td><td>'+Math.round((o.probability||0)*1000)/10+'%</td><td>×'+Number(o.price).toFixed(2)+'</td><td><button class="btn primary" onclick="placeChampionBet('+i+')">'+(editingChampionBet?'儲存':'下注')+'</button></td></tr>').join('')+'</tbody></table>'}
function placeChampionBet(index){const o=((payloadMeta&&payloadMeta.championOdds)||[])[index];const amt=Math.floor(Number(document.getElementById('championStake').value||0));if(!o||amt<10)return alert('下注金額至少 NT$10');if(finalWinner())return alert('冠軍已出爐，不能下注');if(editingChampionBet){if(amt>balance+editingChampionBet.amount)return alert('餘額不足');balance+=editingChampionBet.amount-amt;Object.assign(editingChampionBet,{pick:o.team,pickLabel:teamName(o.team)+' 冠軍',odd:Number(o.price),amount:amt,payout:Math.round(amt*Number(o.price)),updatedAt:new Date().toISOString()});editingChampionBet=null}else{if(amt>balance)return alert('餘額不足');balance-=amt;bets.unshift({id:crypto.randomUUID(),market:'champion',pick:o.team,pickLabel:teamName(o.team)+' 冠軍',odd:Number(o.price),amount:amt,payout:Math.round(amt*Number(o.price)),status:'pending',createdAt:new Date().toISOString(),bookmaker:o.bookmaker||'Model'})}save();render()}
function openBet(id){editingBet=null;currentMatch=matches.find(m=>m.id===id);selected=null;currentMarket='h2h';document.getElementById('stake').value=100;document.getElementById('placeBtn').textContent='確認下注';document.getElementById('mTitle').textContent=teamName(currentMatch.team1)+' vs '+teamName(currentMatch.team2);const inputs=currentMatch.odds&&currentMatch.odds.inputs;const xg=inputs?' · xG '+inputs.expectedGoalsHome+' : '+inputs.expectedGoalsAway:'';document.getElementById('mMeta').textContent=(currentMatch.venue||'')+' · '+new Date(currentMatch.kickoffUTC).toLocaleString('zh-TW')+' · '+(currentMatch.odds?.source||'無賠率')+xg;document.getElementById('modal').classList.add('open');switchMarket('h2h')}
function switchMarket(market){currentMarket=market;selected=null;document.querySelectorAll('.market-tab').forEach(x=>x.classList.remove('active'));document.getElementById('mt-'+market).classList.add('active');renderOptions();updatePayout()}
function renderOptions(){const root=document.getElementById('mOptions');const note=document.getElementById('marketNote');const list=(currentMatch.odds&&currentMatch.odds[currentMarket])||[];root.className='options'+(currentMarket==='correct_score'?' score-grid':'');if(!list.length){root.innerHTML='<div class="empty" style="grid-column:1/-1">此玩法目前沒有模型賠率，已停用。</div>';note.textContent='隊伍未定時不產生賠率。';return}root.innerHTML=list.map((o,i)=>'<button class="pick" onclick="selectPick('+i+')">'+o.label+'<b>×'+Number(o.price).toFixed(2)+'</b><small style="display:block;color:var(--muted);margin-top:4px">P '+Math.round((o.probability||0)*1000)/10+'%</small></button>').join('');note.textContent='結算規則：'+(currentMarket==='h2h'?'90 分鐘勝平負。':currentMarket==='spreads'?'以比分加上讓球盤口後判定勝負；目前採半球盤，避免走盤。':'必須完全猜中 90 分鐘正確比分。')+' 此為虛擬模型賠率，非真實博彩公司賠率。'}
function selectPick(index){document.querySelectorAll('.pick').forEach(x=>x.classList.remove('selected'));document.querySelectorAll('.pick')[index].classList.add('selected');const o=currentMatch.odds[currentMarket][index];selected={...o,market:currentMarket};updatePayout()}
function updatePayout(){const amt=Number(document.getElementById('stake').value||0);const btn=document.getElementById('placeBtn');const p=document.getElementById('payout');if(!selected){btn.disabled=true;p.textContent='請選擇投注選項';return}btn.disabled=false;p.textContent='已選：'+selected.label+'；預計獲利 +'+fmt(amt*selected.price-amt)+'，含本金 '+fmt(amt*selected.price)}
function saveBet(){return editingBet?updateBet():placeBet()}
function placeBet(){const amt=Math.floor(Number(document.getElementById('stake').value||0));if(!currentMatch||!selected||amt<10)return alert('下注金額至少 NT$10');if(amt>balance)return alert('餘額不足');balance-=amt;bets.unshift({id:crypto.randomUUID(),matchId:currentMatch.id,matchLabel:teamName(currentMatch.team1)+' vs '+teamName(currentMatch.team2),market:selected.market,pick:selected.key||selected.score,pickLabel:selected.label,odd:Number(selected.price),point:selected.point,homeScore:selected.homeScore,awayScore:selected.awayScore,amount:amt,payout:Math.round(amt*Number(selected.price)),status:'pending',createdAt:new Date().toISOString(),bookmaker:selected.bookmaker||'Model'});save();closeBet();render()}
function updateBet(){const amt=Math.floor(Number(document.getElementById('stake').value||0));if(!currentMatch||!selected||amt<10)return alert('下注金額至少 NT$10');if(!canEditBet(editingBet))return alert('比賽已開始，不能修改下注');if(amt>balance+editingBet.amount)return alert('餘額不足');balance+=editingBet.amount-amt;Object.assign(editingBet,{matchLabel:teamName(currentMatch.team1)+' vs '+teamName(currentMatch.team2),market:selected.market,pick:selected.key||selected.score,pickLabel:selected.label,odd:Number(selected.price),point:selected.point,homeScore:selected.homeScore,awayScore:selected.awayScore,amount:amt,payout:Math.round(amt*Number(selected.price)),bookmaker:selected.bookmaker||'Model',updatedAt:new Date().toISOString()});save();closeBet();render()}
function closeBet(){editingBet=null;document.getElementById('modal').classList.remove('open')}
function canEditBet(b){if(b&&b.market==='champion')return b.status==='pending'&&!finalWinner();const m=b&&matches.find(x=>x.id===b.matchId);return !!(b&&b.status==='pending'&&m&&m.kickoffUTC&&new Date(m.kickoffUTC).getTime()>Date.now())}
function betOptionIndex(m,b){const list=(m.odds&&m.odds[b.market])||[];return list.findIndex(o=>(o.key||o.score)===b.pick&&(b.market!=='spreads'||Number(o.point)===Number(b.point)))}
function openEditBet(id){const b=bets.find(x=>x.id===id);if(!canEditBet(b))return alert('比賽已開始，不能修改下注');const m=matches.find(x=>x.id===b.matchId);const i=betOptionIndex(m,b);if(i<0)return alert('找不到原本的投注選項，不能修改');editingBet=b;currentMatch=m;document.getElementById('stake').value=b.amount;document.getElementById('placeBtn').textContent='儲存修改';document.getElementById('mTitle').textContent=teamName(m.team1)+' vs '+teamName(m.team2);document.getElementById('mMeta').textContent=(m.venue||'')+' · '+new Date(m.kickoffUTC).toLocaleString('zh-TW')+' · 修改下注';document.getElementById('modal').classList.add('open');switchMarket(b.market);selectPick(i)}
function deleteBet(id){const b=bets.find(x=>x.id===id);if(!canEditBet(b))return alert('比賽已開始，不能刪除下注');if(!confirm('刪除此筆下注並退回本金？'))return;balance+=b.amount;bets=bets.filter(x=>x.id!==id);save();render()}
function openEditChampionBet(id){const b=bets.find(x=>x.id===id);if(!canEditBet(b))return alert('冠軍已出爐，不能修改下注');editingChampionBet=b;document.getElementById('championStake').value=b.amount;showTab('champion')}
function cancelChampionEdit(){editingChampionBet=null;renderChampion()}
function renderHistory(){const root=document.getElementById('historyRoot');if(!bets.length){root.innerHTML='<div class="empty">尚無下注記錄</div>';return}root.innerHTML='<table class="history"><thead><tr><th>賽事</th><th>玩法</th><th>選項</th><th>金額</th><th>賠率</th><th>損益</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+bets.map(b=>{let profit='—',pc='var(--muted)';if(b.status==='win'){const p=b.payout-b.amount;profit='+'+fmt(p);pc='var(--green)'}else if(b.status==='loss'){profit='-'+fmt(b.amount);pc='var(--red)'}return '<tr><td>'+(b.market==='champion'?'2026 世界盃冠軍':b.matchLabel)+(b.finalScore?' <small>('+b.finalScore+')</small>':'')+'</td><td>'+({h2h:'勝平負',spreads:'讓球',correct_score:'正確比分',champion:'猜冠軍'}[b.market]||b.market)+'</td><td>'+b.pickLabel+'</td><td>'+fmt(b.amount)+'</td><td>×'+b.odd+'</td><td style="color:'+pc+';font-weight:700">'+profit+'</td><td>'+({pending:'待結算',win:'✅ 勝',loss:'❌ 負'}[b.status]||b.status)+'</td><td>'+(canEditBet(b)?'<button class="btn" onclick="'+(b.market==='champion'?'openEditChampionBet':'openEditBet')+'(&quot;'+b.id+'&quot;)">修改</button> <button class="btn" onclick="deleteBet(&quot;'+b.id+'&quot;)">刪除</button>':'已鎖定')+'</td></tr>'}).join('')+'</tbody></table>'}
function showTab(t){if(t!=='history'&&t!=='champion')matchFilter=t;document.getElementById('matchesView').classList.toggle('hide',t==='history'||t==='champion');document.getElementById('championView').classList.toggle('hide',t!=='champion');document.getElementById('historyView').classList.toggle('hide',t!=='history');document.getElementById('tabUnfinished').classList.toggle('active',t==='unfinished');document.getElementById('tabFinished').classList.toggle('active',t==='finished');document.getElementById('tabChampion').classList.toggle('active',t==='champion');document.getElementById('tabHistory').classList.toggle('active',t==='history');renderMatches();renderChampion()}
loadData();setInterval(loadData,5*60*1000);
</script>
